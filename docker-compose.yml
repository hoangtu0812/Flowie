services:
   postgres:
      image: postgres:16-alpine
      pull_policy: never
      container_name: circle-postgres
      restart: unless-stopped
      environment:
         POSTGRES_DB: ${POSTGRES_DB:-circle}
         POSTGRES_USER: ${POSTGRES_USER:-circle}
         POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-circle}
      ports:
         - '${POSTGRES_PORT:-5433}:5432'
      volumes:
         - postgres_data:/var/lib/postgresql/data
      healthcheck:
         test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
         interval: 10s
         timeout: 5s
         retries: 5

   minio:
      image: minio/minio:latest
      pull_policy: never
      container_name: circle-minio
      restart: unless-stopped
      command: server /data --console-address ':9001'
      environment:
         MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
         MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      ports:
         - '${MINIO_PORT:-9000}:9000'
         - '${MINIO_CONSOLE_PORT:-9001}:9001'
      volumes:
         - minio_data:/data
      healthcheck:
         test: ['CMD', 'mc', 'ready', 'local']
         interval: 10s
         timeout: 5s
         retries: 5

   migrate:
      profiles: ['app']
      pull_policy: never
      build:
         context: .
         dockerfile: infrastructure/docker/prisma-migrate.Dockerfile
      container_name: circle-migrate
      restart: 'no'
      environment:
         DATABASE_URL: postgresql://${POSTGRES_USER:-circle}:${POSTGRES_PASSWORD:-circle}@circle-postgres:5432/${POSTGRES_DB:-circle}?schema=public
      depends_on:
         postgres:
            condition: service_healthy

   api:
      profiles: ['app']
      pull_policy: never
      build:
         context: .
         dockerfile: infrastructure/docker/python-api.Dockerfile
         args:
            PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
      container_name: circle-api
      environment:
         API_PORT: 4000
         FLOWIE_REVISION: ${FLOWIE_DEPLOY_SHA:-local}
         API_CORS_ORIGIN: http://localhost:3000
         # Absolute base for the links carried by Discord notifications.
         APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
         # Public REST API base that MCP upload URLs start with.
         API_PUBLIC_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api/v1}
         POSTGRES_HOST: circle-postgres
         POSTGRES_PORT_INTERNAL: 5432
         MINIO_HOST: circle-minio
         MINIO_PORT_INTERNAL: 9000
         S3_ENDPOINT: http://circle-minio:9000
         S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
         S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
         S3_BUCKET: ${S3_BUCKET:-flowie}
         S3_REGION: ${S3_REGION:-us-east-1}
         DATABASE_URL: postgresql://${POSTGRES_USER:-circle}:${POSTGRES_PASSWORD:-circle}@circle-postgres:5432/${POSTGRES_DB:-circle}?schema=public
         AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-development-only-change-me}
         AUTH_ACCESS_TOKEN_TTL_SECONDS: ${AUTH_ACCESS_TOKEN_TTL_SECONDS:-900}
         AUTH_REFRESH_TOKEN_TTL_DAYS: ${AUTH_REFRESH_TOKEN_TTL_DAYS:-30}
         AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
         AUTH_LOGIN_ACCOUNT_LIMIT: ${AUTH_LOGIN_ACCOUNT_LIMIT:-20}
         AUTH_LOGIN_IP_LIMIT: ${AUTH_LOGIN_IP_LIMIT:-300}
         AUTH_MFA_ENCRYPTION_KEYS: ${AUTH_MFA_ENCRYPTION_KEYS:-}
         SMTP_HOST: ${SMTP_HOST:-}
         SMTP_PORT: ${SMTP_PORT:-587}
         SMTP_USERNAME: ${SMTP_USERNAME:-}
         SMTP_PASSWORD: ${SMTP_PASSWORD:-}
         SMTP_FROM: ${SMTP_FROM:-}
         SMTP_USE_SSL: ${SMTP_USE_SSL:-false}
         ADMIN_EMAIL: ${ADMIN_EMAIL:-}
         AZURE_AD_TENANT_ID: ${AZURE_AD_TENANT_ID:-}
         AZURE_AD_CLIENT_ID: ${AZURE_AD_CLIENT_ID:-}
         AZURE_AD_CLIENT_SECRET: ${AZURE_AD_CLIENT_SECRET:-}
         AZURE_AD_REDIRECT_URI: ${AZURE_AD_REDIRECT_URI:-http://localhost:4000/api/v1/auth/microsoft/callback}
         DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
         DISCORD_BOT_CHANNEL_ID: ${DISCORD_BOT_CHANNEL_ID:-}
         DISCORD_BOT_GUILD_ID: ${DISCORD_BOT_GUILD_ID:-}
         DISCORD_REGISTRATION_CHANNEL_ID: ${DISCORD_REGISTRATION_CHANNEL_ID:-}
         DISCORD_REGISTRATION_CHANNEL_ROLE_ID: ${DISCORD_REGISTRATION_CHANNEL_ROLE_ID:-}
         REGISTRATION_OTP_TTL_SECONDS: ${REGISTRATION_OTP_TTL_SECONDS:-600}
         AGENT_SECRETS_ENCRYPTION_KEY: ${AGENT_SECRETS_ENCRYPTION_KEY:-}
         AGENT_PROVIDER_ALLOWED_HOSTS: ${AGENT_PROVIDER_ALLOWED_HOSTS:-}
         OUTGOING_WEBHOOK_ALLOWED_HOSTS: ${OUTGOING_WEBHOOK_ALLOWED_HOSTS:-}
         SCM_SECRETS_ENCRYPTION_KEY: ${SCM_SECRETS_ENCRYPTION_KEY:-}
         SCM_GITHUB_APP_ID: ${SCM_GITHUB_APP_ID:-}
         SCM_GITHUB_APP_PRIVATE_KEY: ${SCM_GITHUB_APP_PRIVATE_KEY:-}
         SCM_GITHUB_WEBHOOK_SECRET: ${SCM_GITHUB_WEBHOOK_SECRET:-}
         SCM_SYNC_INTERVAL_SECONDS: ${SCM_SYNC_INTERVAL_SECONDS:-0}
         TEAM_POLICY_SCAN_INTERVAL_SECONDS: ${TEAM_POLICY_SCAN_INTERVAL_SECONDS:-3600}
         TEAM_POLICY_WRITES_ENABLED: ${TEAM_POLICY_WRITES_ENABLED:-true}
         MCP_ENABLED: ${MCP_ENABLED:-false}
         MCP_WRITES_ENABLED: ${MCP_WRITES_ENABLED:-false}
         MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-localhost:*,127.0.0.1:*,[::1]:*}
         MCP_RATE_LIMIT: ${MCP_RATE_LIMIT:-60}
         MCP_TOOL_TIMEOUT_SECONDS: ${MCP_TOOL_TIMEOUT_SECONDS:-30}
         MCP_MAX_RESULT_BYTES: ${MCP_MAX_RESULT_BYTES:-262144}
         MCP_MAX_IDEMPOTENCY_KEYS: ${MCP_MAX_IDEMPOTENCY_KEYS:-10000}
         # Personal coding sandboxes (docs/sandbox.md); empty SANDBOX_USERS keeps them off.
         # VI: Sandbox lập trình cá nhân (docs/sandbox.md); SANDBOX_USERS rỗng là tắt.
         SANDBOX_USERS: ${SANDBOX_USERS:-}
         SANDBOX_MANAGER_TOKEN: ${SANDBOX_MANAGER_TOKEN:-}
         SANDBOX_IDLE_MINUTES: ${SANDBOX_IDLE_MINUTES:-60}
      ports:
         - '${API_PORT:-4000}:4000'
      # The API reaches each sandbox's termi by container name on the sandbox
      # network. Its fixed address sits below the range handed to sandboxes, so
      # no sandbox can ever hold the one address the firewall lets through.
      # VI: API gọi termi của từng sandbox theo tên container trên mạng sandbox. Địa chỉ
      # VI: cố định của nó nằm dưới dải cấp cho sandbox, nên không sandbox nào có được
      # VI: địa chỉ duy nhất mà firewall cho qua.
      networks:
         default: {}
         sandbox:
            ipv4_address: ${SANDBOX_API_IP:-172.31.250.2}
      depends_on:
         postgres:
            condition: service_healthy
         migrate:
            condition: service_completed_successfully
         minio:
            condition: service_healthy

   web:
      profiles: ['app']
      pull_policy: never
      build:
         context: .
         dockerfile: infrastructure/docker/web.Dockerfile
         args:
            NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api/v1}
            NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-}
            UI_BUILD_REVISION: ${UI_BUILD_REVISION:-flowie-web}
            FLOWIE_REVISION: ${FLOWIE_DEPLOY_SHA:-local}
      container_name: circle-web
      environment:
         NODE_ENV: production
      ports:
         - '${WEB_PORT:-3000}:3000'
      depends_on:
         api:
            condition: service_started

   # Creates and stops the per-user coding sandboxes (docs/sandbox.md). It is
   # the only service given the Docker socket, publishes no port and stays on
   # the default network, which the sandboxes are never attached to. It refuses
   # to start without a SANDBOX_MANAGER_TOKEN of at least 32 characters, and
   # without SANDBOX_DOCKER_GID (the group of /var/run/docker.sock on the host)
   # the container cannot be created at all.
   # VI: Tạo và dừng sandbox lập trình của từng người (docs/sandbox.md). Đây là
   # VI: service duy nhất được cấp Docker socket, không mở cổng nào và chỉ ở mạng
   # VI: default, mạng mà sandbox không bao giờ được gắn vào. Nó từ chối khởi động khi
   # VI: thiếu SANDBOX_MANAGER_TOKEN dài ít nhất 32 ký tự, và khi thiếu
   # VI: SANDBOX_DOCKER_GID (group của /var/run/docker.sock trên host) thì container
   # VI: không tạo được.
   sandbox-manager:
      profiles: ['sandbox']
      pull_policy: never
      build:
         context: .
         dockerfile: infrastructure/docker/python-api.Dockerfile
         args:
            PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
      container_name: circle-sandbox-manager
      restart: unless-stopped
      command: ['python', '-m', 'app.sandbox_manager']
      group_add:
         - '${SANDBOX_DOCKER_GID:-docker}'
      environment:
         SANDBOX_MANAGER_TOKEN: ${SANDBOX_MANAGER_TOKEN:-}
         SANDBOX_IMAGE: ${SANDBOX_IMAGE:-flowie-sandbox:latest}
         SANDBOX_CPUS: ${SANDBOX_CPUS:-1}
         SANDBOX_MEMORY_MB: ${SANDBOX_MEMORY_MB:-2048}
         SANDBOX_PIDS: ${SANDBOX_PIDS:-512}
      volumes:
         - /var/run/docker.sock:/var/run/docker.sock

networks:
   default:
      driver: bridge
      driver_opts:
         # The uplink's path MTU is smaller than 1500 (PPPoE gives 1492). A
         # bridge that still claims 1500 stalls large transfers whenever the
         # "fragmentation needed" reply is filtered on the way back, which is
         # what made package downloads crawl and TLS reads time out. The
         # daemon-wide setting does not reach a Compose network, so it is
         # declared here as well.
         com.docker.network.driver.mtu: ${DOCKER_NETWORK_MTU:-1400}
   # Per-user sandboxes (docs/sandbox.md). The bridge name is fixed because the
   # host firewall (infrastructure/sandbox/sandbox-firewall.sh) matches it.
   # VI: Sandbox của từng người (docs/sandbox.md). Tên bridge cố định vì firewall của
   # VI: host (infrastructure/sandbox/sandbox-firewall.sh) khớp theo nó.
   sandbox:
      name: flowie-sandbox
      driver: bridge
      driver_opts:
         com.docker.network.bridge.name: flowie-sbx0
         com.docker.network.driver.mtu: ${DOCKER_NETWORK_MTU:-1400}
      ipam:
         config:
            - subnet: ${SANDBOX_SUBNET:-172.31.250.0/24}
              ip_range: ${SANDBOX_IP_RANGE:-172.31.250.128/25}

volumes:
   postgres_data:
   minio_data:
