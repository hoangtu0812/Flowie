services:
   postgres:
      image: postgres:16-alpine
      pull_policy: never
      container_name: circle-postgres
      restart: unless-stopped
      environment:
         POSTGRES_DB: ${POSTGRES_DB:-circle}
         POSTGRES_USER: ${POSTGRES_USER:-circle}
         POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-circle}
      ports:
         - '${POSTGRES_PORT:-5433}:5432'
      volumes:
         - postgres_data:/var/lib/postgresql/data
      healthcheck:
         test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
         interval: 10s
         timeout: 5s
         retries: 5

   redis:
      image: redis:7-alpine
      pull_policy: never
      container_name: circle-redis
      restart: unless-stopped
      ports:
         - '${REDIS_PORT:-6379}:6379'
      volumes:
         - redis_data:/data
      healthcheck:
         test: ['CMD', 'redis-cli', 'ping']
         interval: 10s
         timeout: 5s
         retries: 5

   minio:
      image: minio/minio:latest
      pull_policy: never
      container_name: circle-minio
      restart: unless-stopped
      command: server /data --console-address ':9001'
      environment:
         MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
         MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      ports:
         - '${MINIO_PORT:-9000}:9000'
         - '${MINIO_CONSOLE_PORT:-9001}:9001'
      volumes:
         - minio_data:/data
      healthcheck:
         test: ['CMD', 'mc', 'ready', 'local']
         interval: 10s
         timeout: 5s
         retries: 5

   api:
      profiles: ['app']
      pull_policy: never
      build:
         context: .
         dockerfile: infrastructure/docker/python-api.Dockerfile
      container_name: circle-api
      environment:
         API_PORT: 4000
         API_CORS_ORIGIN: http://localhost:3000
         # Absolute base for the links carried by Discord notifications.
         APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
         POSTGRES_HOST: postgres
         POSTGRES_PORT_INTERNAL: 5432
         REDIS_HOST: redis
         REDIS_PORT_INTERNAL: 6379
         MINIO_HOST: minio
         MINIO_PORT_INTERNAL: 9000
         S3_ENDPOINT: http://minio:9000
         S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
         S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
         S3_BUCKET: ${S3_BUCKET:-flowie}
         S3_REGION: ${S3_REGION:-us-east-1}
         DATABASE_URL: postgresql://${POSTGRES_USER:-circle}:${POSTGRES_PASSWORD:-circle}@postgres:5432/${POSTGRES_DB:-circle}?schema=public
         AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-development-only-change-me}
         AUTH_ACCESS_TOKEN_TTL_SECONDS: ${AUTH_ACCESS_TOKEN_TTL_SECONDS:-900}
         AUTH_REFRESH_TOKEN_TTL_DAYS: ${AUTH_REFRESH_TOKEN_TTL_DAYS:-30}
         AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
         DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
         DISCORD_BOT_CHANNEL_ID: ${DISCORD_BOT_CHANNEL_ID:-}
      ports:
         - '${API_PORT:-4000}:4000'
      depends_on:
         postgres:
            condition: service_healthy
         redis:
            condition: service_healthy
         minio:
            condition: service_healthy

   web:
      profiles: ['app']
      pull_policy: never
      build:
         context: .
         dockerfile: infrastructure/docker/web.Dockerfile
         args:
            NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api/v1}
            UI_BUILD_REVISION: ${UI_BUILD_REVISION:-circle-ui-preview-20260825}
      container_name: circle-web
      environment:
         NODE_ENV: production
      ports:
         - '${WEB_PORT:-3000}:3000'
      depends_on:
         api:
            condition: service_started

   worker:
      profiles: ['app']
      pull_policy: never
      build:
         context: .
         dockerfile: infrastructure/docker/worker.Dockerfile
      container_name: circle-worker
      environment:
         NODE_ENV: production
         REDIS_URL: redis://redis:6379
         DATABASE_URL: postgresql://${POSTGRES_USER:-circle}:${POSTGRES_PASSWORD:-circle}@postgres:5432/${POSTGRES_DB:-circle}?schema=public
         TEAM_POLICY_SCAN_INTERVAL_MS: ${TEAM_POLICY_SCAN_INTERVAL_MS:-3600000}
      depends_on:
         redis:
            condition: service_healthy
         postgres:
            condition: service_healthy

volumes:
   postgres_data:
   redis_data:
   minio_data:
