<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Vibrant Fluid Flow Gradient -->
    <linearGradient id="flowieFGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>

    <!-- Soft Ambient Glow -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#3B82F6" flood-opacity="0.25" />
    </filter>
  </defs>

  <g filter="url(#softGlow)">
    <!-- Main Stem & Top Wave of 'F' -->
    <path 
      d="M 185,380 C 185,285 195,190 230,135 C 265,90 340,90 380,110" 
      fill="none" 
      stroke="url(#flowieFGrad)" 
      stroke-width="48" 
      stroke-linecap="round" 
      stroke-linejoin="round"
    />

    <!-- Middle Flowing Wave Arm of 'F' -->
    <path 
      d="M 215,235 C 265,220 325,215 365,240" 
      fill="none" 
      stroke="url(#flowieFGrad)" 
      stroke-width="42" 
      stroke-linecap="round" 
    />
  </g>

  <!-- Clean Minimal Brand Name -->
  <text 
    x="256" 
    y="460" 
    text-anchor="middle" 
    font-family="system-ui, -apple-system, 'SF Pro Rounded', 'Segoe UI', Roboto, sans-serif" 
    font-weight="800" 
    font-size="44" 
    fill="url(#flowieFGrad)" 
    letter-spacing="2"
  >Flowie</text>
</svg>
