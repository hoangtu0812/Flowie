name: Deploy Flowie production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flowie-production
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/verify-mcp.yml

  deploy:
    needs: verify
    name: Build and deploy to CT107
    runs-on: [self-hosted, flowie-production]
    # The host downloads Python wheels at a few kB/s, so a cold build can run
    # well past half an hour. Once BuildKit has the wheel cache the build is
    # short again; this ceiling only has to cover the first one.
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Update source and deploy
        shell: bash
        env:
          # Cache mounts in the image builds need BuildKit explicitly enabled.
          DOCKER_BUILDKIT: '1'
          COMPOSE_DOCKER_CLI_BUILD: '1'
          FLOWIE_DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          exec 9>/opt/flowie/.flowie-operation.lock
          flock -x 9

          bash "$GITHUB_WORKSPACE/scripts/checkout-production.sh" /opt/flowie "$FLOWIE_DEPLOY_SHA"
          cd /opt/flowie

          # A registry read that times out is not a broken release. Retry the
          # build before failing the deploy, since every attempt resumes from
          # the layers and package caches the previous one produced.
          built=0
          for attempt in 1 2 3; do
            if docker compose --env-file .env.production --profile app build migrate api web worker; then
              built=1
              break
            fi
            echo "Build attempt ${attempt} failed; retrying in 20s."
            sleep 20
          done
          if [ "${built}" -ne 1 ]; then
            echo 'The image build failed three times; leaving the running deployment untouched.'
            exit 1
          fi

          if ! docker compose --env-file .env.production --profile app up -d --force-recreate --remove-orphans; then
            # Compose reports dependency exit status without the migration engine diagnostic.
            docker compose --env-file .env.production --profile app logs --tail=200 migrate || true
            exit 1
          fi

      - name: Verify API readiness
        shell: bash
        env:
          FLOWIE_DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git -C /opt/flowie rev-parse HEAD)" = "$FLOWIE_DEPLOY_SHA"

          exec 9>/opt/flowie/.flowie-operation.lock
          flock -x 9

          for attempt in {1..24}; do
            if curl -fsS http://localhost:4000/readyz; then
              exit 0
            fi
            sleep 5
          done

          cd /opt/flowie
          docker compose --env-file .env.production --profile app ps
          docker compose --env-file .env.production --profile app logs --tail=150 migrate api web
          exit 1

      - name: Reclaim disk
        # Only after the deploy is verified: a failed release must keep every
        # layer it might need for the next attempt.
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          # Images left dangling by this build. Tagged images still in use and
          # every volume are untouched — the database and object store live in
          # volumes, so they are never part of a cleanup.
          docker image prune --force

          # Build cache is the part that grows without bound. Cap it and let
          # BuildKit evict least-recently-used records, which keeps the Python
          # wheel cache that makes a rebuild fast. Older Docker versions do not
          # know --keep-storage, so fall back to pruning by age.
          docker builder prune --force --keep-storage 10GB || docker builder prune --force --filter until=168h

          docker system df
