name: Deploy Flowie production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flowie-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy to CT107
    runs-on: [self-hosted, flowie-production]
    # The host downloads Python wheels at a few kB/s, so a cold build can run
    # well past half an hour. Once BuildKit has the wheel cache the build is
    # short again; this ceiling only has to cover the first one.
    timeout-minutes: 120

    steps:
      - name: Update source and deploy
        shell: bash
        env:
          # Cache mounts in the image builds need BuildKit explicitly enabled.
          DOCKER_BUILDKIT: '1'
          COMPOSE_DOCKER_CLI_BUILD: '1'
        run: |
          set -euo pipefail

          cd /opt/flowie
          git fetch origin main
          git checkout main
          git pull --ff-only origin main

          # A registry read that times out is not a broken release. Retry the
          # build before failing the deploy, since every attempt resumes from
          # the layers and package caches the previous one produced.
          built=0
          for attempt in 1 2 3; do
            if docker compose --env-file .env.production --profile app build api web worker; then
              built=1
              break
            fi
            echo "Build attempt ${attempt} failed; retrying in 20s."
            sleep 20
          done
          if [ "${built}" -ne 1 ]; then
            echo 'The image build failed three times; leaving the running deployment untouched.'
            exit 1
          fi

          docker compose --env-file .env.production --profile app up -d --force-recreate --remove-orphans

      - name: Verify API readiness
        shell: bash
        run: |
          set -euo pipefail

          for attempt in {1..24}; do
            if curl -fsS http://localhost:4000/readyz; then
              exit 0
            fi
            sleep 5
          done

          cd /opt/flowie
          docker compose --env-file .env.production --profile app ps
          docker compose --env-file .env.production --profile app logs --tail=150 api web
          exit 1
