name: Verify Flowie Desktop

# The desktop workspace builds for the machines it ships to, so a Windows
# build passing is no evidence for macOS and the reverse. Both run on every
# change that touches the workspace.
# VI: Workspace desktop build cho đúng những máy nó phát hành tới, nên build
# VI: Windows xanh không phải bằng chứng cho macOS và ngược lại. Cả hai chạy
# VI: với mọi thay đổi chạm workspace.
on:
  push:
    branches: [main]
    paths:
      - 'apps/desktop/**'
      - '.github/workflows/desktop.yml'
  pull_request:
    paths:
      - 'apps/desktop/**'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flowie-desktop-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/desktop

jobs:
  desktop:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # rust-toolchain.toml pins the version, so no toolchain is named here;
      # naming one in two places is how the two drift apart.
      # VI: rust-toolchain.toml đã ghim phiên bản nên ở đây không nêu toolchain;
      # VI: nêu ở hai nơi chính là cách để chúng lệch nhau.
      - name: Show toolchain
        run: |
          rustup show active-toolchain
          cargo --version

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-tauri.exe
            apps/desktop/target
          key: ${{ matrix.os }}-cargo-${{ hashFiles('apps/desktop/Cargo.lock') }}
          restore-keys: ${{ matrix.os }}-cargo-

      - name: Formatting
        run: cargo fmt --all --check

      - name: Lints
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace --all-targets

      - name: Build
        run: cargo build --workspace

      # A release binary anyone can download and run. There is no installer
      # yet, so without this the only way to try a change is to build it, and
      # "it compiles" keeps standing in for "it works".
      # VI: Một bản release ai cũng tải về chạy được. Chưa có bộ cài, nên thiếu
      # VI: bước này thì cách duy nhất để thử một thay đổi là tự build, và "nó
      # VI: biên dịch được" cứ bị dùng thay cho "nó chạy được".
      - name: Build the companion for trying out
        run: cargo build --release -p flowie-desktop

      - name: Keep the Windows build
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: flowie-desktop-windows
          path: apps/desktop/target/release/flowie-desktop.exe
          if-no-files-found: error
          retention-days: 14

      # The installer is what a person can actually be handed. It is not
      # signed, so Windows warns on first run; signing needs the organisation's
      # certificate and belongs to DTD-488.
      # VI: Bo cai moi la thu dua cho mot nguoi duoc. No chua duoc ky so nen
      # VI: Windows se canh bao o lan chay dau; ky so can chung chi cua to chuc
      # VI: va thuoc DTD-488.
      - name: Build the Windows installer
        if: matrix.os == 'windows-latest'
        # The bundle directory is removed first because the target directory is
        # cached: an installer from an earlier version survives there, and the
        # upload glob would pick it up too, so the artifact would offer two
        # versions and no way to tell which one was just built.
        # VI: Thư mục bundle bị xoá trước vì thư mục target được cache: bộ cài
        # VI: của phiên bản trước còn nằm lại, và glob tải lên sẽ quét trúng cả nó,
        # VI: nên artifact sẽ có hai phiên bản mà không biết bản nào vừa được build.
        run: |
          cargo install tauri-cli --version "^2" --locked
          Remove-Item -Recurse -Force ../target/release/bundle -ErrorAction SilentlyContinue
          cargo tauri bundle
        shell: pwsh
        working-directory: apps/desktop/src-tauri

      - name: Keep the Windows installer
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: flowie-desktop-windows-installer
          path: apps/desktop/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 14
