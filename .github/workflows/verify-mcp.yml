name: Verify MCP and application contracts

# The browser suite runs one test at a time because every test shares one
# database, and that single step was 38 of the 46 minutes a run took. Splitting
# it by browser project gives each one its own Postgres service container, so
# the three run at once without a line of test code changing and without
# raising Playwright's worker count, which is what would bring back the
# cross-test interference DTD-506 removed.
# VI: Bộ test trình duyệt chạy mỗi lúc một test vì mọi test dùng chung một
# VI: database, và riêng bước đó chiếm 38 trong 46 phút của một lần chạy. Tách
# VI: theo project trình duyệt cho mỗi bên một service container Postgres riêng,
# VI: nên cả ba chạy cùng lúc mà không phải sửa một dòng test nào và không phải
# VI: nâng số worker của Playwright — thứ sẽ kéo lại đúng kiểu nhiễu chéo giữa
# VI: các test mà DTD-506 đã dọn.

# Pull requests into main run it on their own when they touch a path below;
# the changes job then narrows which jobs that pull request needs. Nothing runs
# on a push to main, so a commit pushed there directly — a release commit
# above all — is checked only by running this with workflow_dispatch. The
# paths cover every pattern the changes job tests, so a file that can select
# a job also starts the run.
# VI: Pull request vào main tự chạy workflow này khi chạm tới một path bên
# VI: dưới; job changes sau đó thu hẹp những job mà pull request đó cần. Không
# VI: có gì chạy khi push lên main, nên commit đẩy thẳng lên đó — trước hết là
# VI: commit release — chỉ được kiểm khi chạy tay bằng workflow_dispatch. Danh
# VI: sách path phủ mọi mẫu mà job changes kiểm tra, nên file nào có thể chọn
# VI: một job thì cũng khởi động lần chạy.
on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/api-python/**'
      - 'apps/web/**'
      - 'packages/**'
      - 'scripts/**'
      - 'infrastructure/**'
      - 'docker-compose.yml'
      - 'pnpm-lock.yaml'
      - 'ruff.toml'
      - '.github/workflows/verify-mcp.yml'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: verify-mcp-${{ github.ref }}
  cancel-in-progress: true

env:
  POSTGRES_TEST_URL: postgresql://flowie_test:test-only-password@localhost:5432/flowie_mcp_test

jobs:
  # Which halves of the suite this change can possibly affect. Anything that is
  # not a pull request — a release commit checked with workflow_dispatch above
  # all — runs every job, because a release must never be judged on a subset.
  # VI: Thay đổi này có thể ảnh hưởng tới những phần nào của bộ kiểm tra. Mọi
  # VI: thứ không phải pull request — trước hết là commit release được kiểm bằng
  # VI: workflow_dispatch — đều chạy đủ mọi job, vì một bản phát hành không bao
  # VI: giờ được đánh giá trên một tập con.
  changes:
    name: scope
    # Every job names its image instead of ubuntu-latest: when that label moved
    # to Ubuntu 26.04 it broke the storage job before a single test ran. A new
    # image is now adopted on purpose, in its own change.
    # VI: Mọi job ghi rõ image thay vì ubuntu-latest: khi nhãn đó chuyển sang
    # VI: Ubuntu 26.04, job storage hỏng trước khi có một test nào chạy. Từ nay
    # VI: lên image mới là việc có chủ ý, trong một thay đổi riêng.
    runs-on: ubuntu-24.04
    outputs:
      backend: ${{ steps.scope.outputs.backend }}
      storage: ${{ steps.scope.outputs.storage }}
      web: ${{ steps.scope.outputs.web }}
      e2e: ${{ steps.scope.outputs.e2e }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: scope
        env:
          BASE_REF: ${{ github.base_ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request" ]; then
            for scope in backend storage web e2e; do echo "$scope=true" >> "$GITHUB_OUTPUT"; done
            echo "Not a pull request: every job runs."
            exit 0
          fi
          git fetch --no-tags origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
          changed=$(git diff --name-only "origin/$BASE_REF...HEAD")
          echo "Changed files:"; echo "$changed"
          # The browser suite never loads unit tests or Markdown, so a change made
          # only of those cannot fail it. Background jobs stay in scope: the UI
          # harness runs create_app, whose lifespan starts every loop.
          # VI: Bộ test trình duyệt không bao giờ nạp unit test hay Markdown, nên
          # VI: một thay đổi chỉ gồm những file đó không thể làm nó hỏng. Job nền
          # VI: vẫn nằm trong phạm vi: harness UI chạy create_app, và lifespan của
          # VI: nó khởi động mọi loop.
          e2e_changed=$(echo "$changed" | grep -vE '^apps/api-python/tests/|^apps/web/tests/|\.md$' || true)
          scope_matches() { if [ "$1" = e2e ]; then echo "$e2e_changed"; else echo "$changed"; fi | grep -qE "$2"; }
          workflow='^\.github/workflows/verify-mcp\.yml$'
          lockfile='^pnpm-lock\.yaml$'
          for entry in \
            "backend:^apps/api-python/|^packages/database/|^scripts/|^ruff\.toml$|$workflow|$lockfile" \
            "storage:^scripts/verify-storage-acceptance\.sh$|^scripts/flowie_backup/|^scripts/flowie-backup\.py$|^infrastructure/|^docker-compose\.yml$|$workflow" \
            "web:^apps/web/|^packages/|^docker-compose\.yml$|$workflow|$lockfile" \
            "e2e:^apps/web/|^apps/api-python/|^packages/|^scripts/seed-ui-regression\.py$|^scripts/ui_regression_api\.py$|$workflow|$lockfile" \
          ; do
            name=${entry%%:*}
            if scope_matches "$name" "${entry#*:}"; then echo "$name=true" >> "$GITHUB_OUTPUT"; else echo "$name=false" >> "$GITHUB_OUTPUT"; fi
          done
          cat "$GITHUB_OUTPUT"

  backend:
    name: backend and MCP contracts
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: flowie_test
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: flowie_mcp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flowie_test -d flowie_mcp_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PYTHONPATH: apps/api-python
      DATABASE_URL: postgresql://flowie_test:test-only-password@localhost:5432/flowie_mcp_test
      MCP_TEST_DATABASE_URL: postgresql://flowie_test:test-only-password@localhost:5432/flowie_mcp_test
      SCM_TEST_DATABASE_URL: postgresql://flowie_test:test-only-password@localhost:5432/flowie_mcp_test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/api-python/requirements.txt
      - uses: pnpm/action-setup@v4
        with:
          version: '9.15.9'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
      - name: Install dependencies
        run: |
          python -m pip install -r apps/api-python/requirements.txt pytest==9.1.1 ruff==0.15.4 mypy==2.4.1
          pnpm install --frozen-lockfile
      - name: Validate and migrate a clean database
        run: |
          pnpm --filter @flowie/database exec prisma validate --schema prisma/schema.prisma
          pnpm --filter @flowie/database exec prisma migrate deploy --schema prisma/schema.prisma
          pnpm --filter @flowie/database exec prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code
          pnpm --filter @flowie/database exec prisma generate --schema prisma/schema.prisma
      # Table and column names in the API's raw SQL must exist in schema.prisma; a renamed
      # column fails here instead of on the first request that runs the statement.
      # VI: Tên bảng và cột trong SQL thô của API phải có trong schema.prisma; cột bị đổi tên
      # VI: sẽ lỗi ở đây thay vì ở request đầu tiên chạy câu lệnh đó.
      - name: Check SQL names against schema.prisma
        run: python scripts/check_sql_schema.py
      - name: Verify backend and MCP integration
        run: |
          ruff check apps/api-python scripts
          (cd apps/api-python && mypy app)
          python -m pytest apps/api-python/tests -q

  storage:
    name: storage and mail transports
    needs: changes
    if: needs.changes.outputs.storage == 'true'
    # Pinned because the backup rehearsal needs a host pg_dump 16 at
    # /usr/lib/postgresql/16/bin to match the postgres:16 service, and the
    # Ubuntu 26.04 image behind ubuntu-latest has no postgresql-client-16.
    # VI: Ghim image vì bài diễn tập sao lưu cần pg_dump 16 trên máy chạy, tại
    # /usr/lib/postgresql/16/bin, khớp với service postgres:16, mà image
    # Ubuntu 26.04 của ubuntu-latest không có gói postgresql-client-16.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: flowie_test
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: flowie_mcp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flowie_test -d flowie_mcp_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PYTHONPATH: apps/api-python
      DATABASE_URL: postgresql://flowie_test:test-only-password@localhost:5432/flowie_mcp_test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/api-python/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r apps/api-python/requirements.txt pytest==9.1.1
      - name: Install pinned storage fixture toolchain
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.8'
          cache: false
      # Keeps the pinned restic archive between runs. Without it every run
      # downloads from a third party's release hosting, and an outage there
      # fails the job before a single test has run — it blocked a release for
      # hours. The key carries the version, so a bump fetches once and then
      # stops touching that host again.
      # VI: Giữ lại tệp restic đã ghim giữa các lần chạy. Không có nó thì mỗi
      # lần chạy đều tải từ nơi phát hành của bên thứ ba, và sự cố bên đó làm
      # hỏng job trước khi có một test nào chạy — việc này từng chặn một bản
      # phát hành suốt nhiều giờ. Khoá cache mang theo số phiên bản, nên khi
      # nâng phiên bản thì tải một lần rồi thôi không chạm tới host đó nữa.
      - name: Cache the pinned restic archive
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/flowie-restic
          key: restic-0.19.1
      - name: Verify pinned source MinIO and SMTP transports
        env:
          RESTIC_CACHE_DIR: ${{ runner.temp }}/flowie-restic
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16
          bash scripts/verify-storage-acceptance.sh

  web:
    name: web build and unit tests
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: '9.15.9'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
      # Next's incremental build cache. A warm cache rebuilt the app in about
      # two thirds of a cold build locally, and unlike a whole-build cache it
      # still helps when CHANGELOG.md, an input of every build, changes. The key
      # is the lockfile plus every tracked source under apps/web and packages,
      # so a commit that changes no source restores an exact match; any other
      # commit falls back to the newest cache for the same lockfile and Next
      # reuses the modules that did not change. The step runs before install
      # and build, so the hash walks no node_modules or build output. All ten
      # jobs that build web share one key: the first to finish saves it and the
      # rest skip the save, so a commit adds one entry, which GitHub evicts
      # oldest-first under the repository's 10 GB limit.
      # VI: Cache build tăng dần của Next. Tại chỗ, cache ấm build lại app mất
      # VI: khoảng hai phần ba thời gian build lạnh, và khác với cache cả bản
      # VI: build, nó vẫn có ích khi CHANGELOG.md, một input của mọi bản build,
      # VI: thay đổi. Key gồm lockfile và mọi mã nguồn được theo dõi trong
      # VI: apps/web và packages, nên commit không đổi mã nguồn khôi phục đúng
      # VI: key; commit khác lùi về cache mới nhất của cùng lockfile và Next dùng
      # VI: lại các module không đổi. Bước này chạy trước install và build, nên
      # VI: phép hash không duyệt node_modules hay đầu ra build. Cả mười job build
      # VI: web dùng chung một key: job xong trước lưu, các job còn lại bỏ qua
      # VI: bước lưu, nên mỗi commit thêm một mục, GitHub xoá mục cũ nhất trước
      # VI: khi vượt hạn mức 10 GB của repository.
      - name: Cache the Next.js build cache
        uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/web/**', 'packages/**', '!**/node_modules/**', '!**/.next/**') }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build web and verify Compose dependencies
        run: |
          pnpm --filter @flowie/database exec prisma generate --schema prisma/schema.prisma
          pnpm --filter @flowie/contracts build
          pnpm --filter @flowie/web lint --max-warnings 0
          pnpm --filter @flowie/web test:unit
          pnpm --filter @flowie/web build
          docker compose --profile app config --quiet

  # Each browser's suite is split into three shards by spec file, every shard
  # with its own Postgres, so tests still run one at a time against a database
  # no other job touches. A browser took up to 12 minutes in one job; three
  # shards bring the slowest job near a third of that plus setup. The repository
  # is public, so the extra runners cost queue slots, not money.
  # VI: Bộ test của mỗi trình duyệt được chia thành ba shard theo file spec, mỗi
  # VI: shard có Postgres riêng, nên test vẫn chạy từng cái một trên một database
  # VI: không job nào khác chạm vào. Một trình duyệt từng mất tới 12 phút trong
  # VI: một job; ba shard đưa job chậm nhất về khoảng một phần ba con số đó cộng
  # VI: thời gian chuẩn bị. Repository là public nên runner thêm chỉ tốn slot
  # VI: hàng đợi, không tốn tiền.
  e2e:
    name: browser regression
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-24.04
    # One shard's share of a browser that took 12 minutes in a single job. The
    # ceiling allows for a slow runner, the retry a failing test gets, and the
    # run going all the way through instead of stopping at the fifth failure.
    # VI: Phần của một shard trong một trình duyệt từng mất 12 phút trong một
    # VI: job. Mức trần tính thêm cho máy chạy chậm, cho lần thử lại mà một test
    # VI: hỏng được cấp, và cho việc chạy hết thay vì dừng ở lỗi thứ năm.
    timeout-minutes: 25
    # Playwright's own image for the exact @playwright/test version in
    # apps/web/package.json, so the browsers and every system library they
    # need are already there. Installing them on the runner pulled over a
    # hundred apt packages per shard and took more than 15 minutes when the
    # Ubuntu mirror was slow. The tag must change with that dependency: a
    # mismatched image has no browser build the test runner accepts. User 1001
    # is the runner's own uid, which owns the workspace and HOME; Firefox
    # refuses to start as root in a HOME another user owns. ipc=host gives
    # Chromium the shared memory the default 64 MB would starve.
    # VI: Image chính thức của Playwright đúng phiên bản @playwright/test trong
    # VI: apps/web/package.json, nên trình duyệt và mọi thư viện hệ thống chúng
    # VI: cần đã có sẵn. Cài chúng trên runner kéo hơn trăm gói apt mỗi shard và
    # VI: mất hơn 15 phút khi mirror Ubuntu chậm. Tag phải đổi theo dependency
    # VI: đó: image lệch phiên bản không có bản trình duyệt nào mà test runner
    # VI: chấp nhận. User 1001 là uid của chính runner, chủ của workspace và
    # VI: HOME; Firefox từ chối chạy dưới root trong HOME của user khác.
    # VI: ipc=host cho Chromium đủ bộ nhớ dùng chung mà mức mặc định 64 MB thiếu.
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --user 1001 --ipc=host
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
        shard: [1, 2, 3]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: flowie_test
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: flowie_mcp_test
        options: >-
          --health-cmd "pg_isready -U flowie_test -d flowie_mcp_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PYTHONPATH: apps/api-python
      DATABASE_URL: postgresql://flowie_test:test-only-password@localhost:5432/flowie_mcp_test
      FLOWIE_E2E_DATABASE_URL: postgresql://flowie_test:test-only-password@localhost:5432/flowie_mcp_test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # setup-python's own pip cache builds its key with lsb_release, which
      # the Playwright image does not ship, so the step failed before Python
      # was used; the pip cache is kept by actions/cache instead.
      # VI: Cache pip có sẵn của setup-python tạo key bằng lsb_release, mà
      # VI: image Playwright không có, nên bước đó hỏng trước khi Python được
      # VI: dùng; cache pip được giữ bằng actions/cache thay thế.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache pip downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-noble-${{ hashFiles('apps/api-python/requirements.txt') }}
      - uses: pnpm/action-setup@v4
        with:
          version: '9.15.9'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
      # Same cache and key as the web job above, which explains them.
      # VI: Cùng cache và key với job web ở trên, nơi giải thích chúng.
      - name: Cache the Next.js build cache
        uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/web/**', 'packages/**', '!**/node_modules/**', '!**/.next/**') }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - name: Install dependencies
        run: |
          python -m pip install -r apps/api-python/requirements.txt
          pnpm install --frozen-lockfile
      # The fixture seeder and the UI harness refuse any database host that is
      # not loopback, so they can never write to a real database, and inside
      # this container the service is reachable only as postgres:5432. A
      # plain TCP relay on 127.0.0.1:5432 keeps that guard untouched. It runs
      # in the background until the job's container is removed.
      # VI: Script seed dữ liệu mẫu và harness UI từ chối mọi host database
      # VI: không phải loopback, để không bao giờ ghi vào database thật, mà
      # VI: trong container này service chỉ truy cập được qua postgres:5432.
      # VI: Một relay TCP đơn giản trên 127.0.0.1:5432 giữ nguyên chốt chặn
      # VI: đó. Nó chạy nền cho tới khi container của job bị xoá.
      - name: Relay the Postgres service to loopback
        run: |
          nohup node -e "const net = require('net'); net.createServer((c) => { const s = net.connect(5432, 'postgres'); c.pipe(s).pipe(c); c.on('error', () => s.destroy()); s.on('error', () => c.destroy()); }).listen(5432, '127.0.0.1')" > /dev/null 2>&1 &
          for i in $(seq 1 20); do node -e "require('net').connect(5432, '127.0.0.1').on('connect', () => process.exit(0)).on('error', () => process.exit(1))" && exit 0; sleep 0.5; done
          echo "Postgres relay did not start." >&2; exit 1
      - name: Migrate a clean database
        run: |
          pnpm --filter @flowie/database exec prisma migrate deploy --schema prisma/schema.prisma
          pnpm --filter @flowie/database exec prisma generate --schema prisma/schema.prisma
      - name: Build web
        run: |
          pnpm --filter @flowie/contracts build
          pnpm --filter @flowie/web build
      - name: Verify browser regression workflows
        run: |
          python scripts/seed-ui-regression.py
          pnpm --filter @flowie/web exec playwright test --project=${{ matrix.browser }} --shard=${{ matrix.shard }}/3
      - uses: actions/upload-artifact@v4
        if: failure() || cancelled()
        with:
          name: ui-regression-traces-${{ matrix.browser }}-${{ matrix.shard }}
          path: apps/web/test-results/
          retention-days: 7

  # The one check branch protection requires. Without it a job skipped by the
  # scope filter would leave its required check pending for ever and no pull
  # request could merge. It fails on any outcome that is not success or a
  # deliberate skip, so a cancelled job cannot pass for a green run.
  # VI: Đây là check duy nhất mà branch protection yêu cầu. Thiếu nó, một job bị
  # VI: bỏ qua theo phạm vi sẽ để check bắt buộc của nó treo mãi và không pull
  # VI: request nào merge được. Nó fail với mọi kết cục không phải thành công
  # VI: hoặc bỏ qua có chủ ý, nên một job bị huỷ không thể bị tính là chạy xanh.
  verify:
    name: verify
    needs: [changes, backend, storage, web, e2e]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require every job that ran to have succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$RESULTS"
          failed=$(echo "$RESULTS" | grep -oE '"result"[[:space:]]*:[[:space:]]*"[a-z]+"' | grep -vE '"(success|skipped)"' || true)
          if [ -n "$failed" ]; then
            echo "A required job did not succeed." >&2
            exit 1
          fi
          echo "Every job that ran succeeded."
