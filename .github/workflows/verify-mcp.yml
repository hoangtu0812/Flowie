name: Verify MCP and application contracts

on:
  pull_request:
    paths:
      - 'apps/api-python/**'
      - 'apps/web/**'
      - 'packages/**'
      - 'docker-compose.yml'
      - 'pnpm-lock.yaml'
      - '.github/workflows/verify-mcp.yml'
      - 'scripts/**'
  push:
    branches: ['codex/**']
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: flowie_test
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: flowie_mcp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flowie_test -d flowie_mcp_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PYTHONPATH: apps/api-python
      DATABASE_URL: postgresql://flowie_test:test-only-password@localhost:5432/flowie_mcp_test
      MCP_TEST_DATABASE_URL: postgresql://flowie_test:test-only-password@localhost:5432/flowie_mcp_test
      SCM_TEST_DATABASE_URL: postgresql://flowie_test:test-only-password@localhost:5432/flowie_mcp_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/api-python/requirements.txt
      - uses: pnpm/action-setup@v4
        with:
          version: '9.15.9'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
      - name: Install dependencies
        run: |
          python -m pip install -r apps/api-python/requirements.txt pytest==9.1.1 ruff==0.15.4
          pnpm install --frozen-lockfile
      - name: Validate and migrate a clean database
        run: |
          pnpm --filter @circle/database exec prisma validate --schema prisma/schema.prisma
          pnpm --filter @circle/database exec prisma migrate deploy --schema prisma/schema.prisma
          pnpm --filter @circle/database exec prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code
          pnpm --filter @circle/database exec prisma generate --schema prisma/schema.prisma
      - name: Verify backend and MCP integration
        run: |
          ruff check apps/api-python/app/modules apps/api-python/app/core/clock.py apps/api-python/app/core/dates.py apps/api-python/app/core/identifiers.py apps/api-python/app/db/mutations.py --select F
          ruff check apps/api-python/app --select F821
          ruff check scripts/flowie_runner --select F
          python -m pytest apps/api-python/tests -q
      - name: Verify isolated real object storage
        env:
          S3_TEST_ENDPOINT: http://127.0.0.1:9000
        run: |
          docker pull minio/minio:latest
          docker compose up -d minio
          for attempt in $(seq 1 30); do
            if curl --fail --silent "$S3_TEST_ENDPOINT/minio/health/ready"; then break; fi
            if [ "$attempt" -eq 30 ]; then exit 1; fi
            sleep 2
          done
          python -m pytest apps/api-python/tests/test_infrastructure_acceptance.py -q
      - name: Build web and verify Compose dependencies
        run: |
          pnpm --filter @circle/contracts build
          pnpm --filter @circle/web test:unit
          pnpm --filter @circle/web build
          docker compose --profile app config --quiet
      - name: Verify browser regression workflows
        env:
          FLOWIE_E2E_DATABASE_URL: postgresql://flowie_test:test-only-password@localhost:5432/flowie_mcp_test
        run: |
          python scripts/seed-ui-regression.py
          pnpm --filter @circle/web exec playwright install --with-deps chromium firefox webkit
          pnpm --filter @circle/web test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ui-regression-traces
          path: apps/web/test-results/
          retention-days: 7
