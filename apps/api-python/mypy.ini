# Type checking for the Python API. Run from apps/api-python: `mypy app`.
# VI: Kiểm tra kiểu cho API Python. Chạy trong apps/api-python: `mypy app`.
#
# Every package is checked at the same level, including the bodies of functions
# without annotations. A package that passes must not be moved to a weaker
# level; tighten instead (DTD-521).
# VI: Mọi package được kiểm cùng một mức, kể cả thân hàm không có chú thích kiểu.
# VI: Package đã qua thì không được hạ xuống mức yếu hơn; chỉ được siết thêm.
[mypy]
python_version = 3.12
# Third-party packages without type information are treated as Any rather than
# failing the run.
# VI: Thư viện bên thứ ba không có thông tin kiểu được coi là Any thay vì làm
# VI: hỏng lượt kiểm.
ignore_missing_imports = True
check_untyped_defs = True
warn_unused_ignores = True
warn_redundant_casts = True

# The legacy domain modules are being folded into app/modules and mostly
# deleted (DTD-523), so typing them now would be wasted work. New code does
# not go here.
# VI: Các module domain cũ đang được dồn vào app/modules và phần lớn sẽ bị xoá
# VI: (DTD-523), nên kiểu hoá chúng lúc này là phí công. Mã mới không đặt ở đây.
[mypy-app.domains.*]
ignore_errors = True
