[package]
name = "flowie-desktop"
description = "Flowie Desktop companion shell"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
# `image-png` is required to load the tray icon from a PNG; without it the
# icon call does not compile. Measured in the DTD-492 spike.
# VI: `image-png` là bắt buộc để nạp icon tray từ PNG; thiếu nó thì lời gọi
# VI: icon không biên dịch được. Đo được trong spike DTD-492.
tauri = { version = "2.12.5", features = ["tray-icon", "image-png"] }
flowie-core = { path = "../crates/flowie-core" }
flowie-platform = { path = "../crates/flowie-platform" }
# The shell is where every adapter finally meets: the server, the checkout
# and the agent. Nothing else in the workspace depends on all three.
# VI: Vỏ ứng dụng là nơi mọi adapter cuối cùng gặp nhau: server, checkout và
# VI: agent. Không phần nào khác trong workspace phụ thuộc cả ba.
flowie-agent = { path = "../crates/flowie-agent" }
flowie-connection = { path = "../crates/flowie-connection" }
flowie-mcp = { path = "../crates/flowie-mcp" }
flowie-repository = { path = "../crates/flowie-repository" }
flowie-workspace = { path = "../crates/flowie-workspace" }
# now_local is what keeps a target end date on the person's own calendar;
# in Vietnam a UTC date is still yesterday until mid-morning.
# VI: now_local là thứ giữ ngày kết thúc dự kiến theo đúng lịch của người dùng;
# VI: ở Việt Nam, ngày theo UTC vẫn là hôm qua cho tới giữa buổi sáng.
time = { version = "0.3", features = ["local-offset"] }
# The configuration window reads and writes the same JSON the companion
# runs on, so it needs the same two crates to parse and report it.
# VI: Cửa sổ cấu hình đọc và ghi đúng JSON mà companion đang chạy, nên nó cần
# VI: đúng hai crate đó để parse và báo lỗi.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Registers the companion to start at sign-in. A plugin rather than a
# registry write of our own: the same call works on macOS, where the
# mechanism is a launch agent and nothing like a registry key.
# VI: Đăng ký companion khởi động cùng lúc đăng nhập. Dùng plugin thay vì tự ghi
# VI: registry: cùng một lời gọi chạy được trên macOS, nơi cơ chế là launch agent
# VI: chứ không phải khóa registry.
tauri-plugin-autostart = "2"
# Opens a page in whatever browser the person already uses, rather than in
# a webview of ours where they would not be signed in.
# VI: Mở một trang bằng đúng trình duyệt người dùng đang dùng, thay vì trong một
# VI: webview của chúng ta nơi họ chưa đăng nhập.
tauri-plugin-opener = "2"
# Asks GitHub whether a newer release exists. Same TLS stack as the MCP
# client, so the installer carries one of them rather than two, and it sits in
# this crate because the shell is already outside the macOS cross-check that
# ring's C dependency would otherwise break.
# VI: Hỏi GitHub xem đã có bản phát hành mới hơn chưa. Dùng cùng bộ TLS với
# VI: client MCP để bộ cài mang một bộ chứ không phải hai, và đặt ở crate này vì
# VI: vỏ ứng dụng vốn đã nằm ngoài phần cross-check macOS mà phụ thuộc C của ring
# VI: sẽ làm hỏng.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt", "time"] }

[dev-dependencies]
tempfile = "3"

