[package]
name = "flowie-core"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
# The endpoint and branch rules live where they are enforced at runtime,
# so configuration validates against the same code rather than a copy
# that can drift away from it.
# VI: Quy tắc endpoint và tên nhánh nằm ở nơi chúng được thực thi lúc
# chạy, nên cấu hình kiểm theo đúng mã đó chứ không theo một bản sao có
# thể lệch đi.
flowie-mcp = { path = "../flowie-mcp", default-features = false }
flowie-repository = { path = "../flowie-repository" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
