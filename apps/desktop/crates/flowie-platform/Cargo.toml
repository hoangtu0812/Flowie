[package]
name = "flowie-platform"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
# Proven against the Windows credential store and the macOS Keychain in
# the DTD-492 spike, including that a missing entry is its own error
# rather than an empty value.
# VI: Đã kiểm chứng với kho credential Windows và Keychain macOS trong
# spike DTD-492, gồm cả việc mục không tồn tại là một lỗi riêng chứ không
# phải giá trị rỗng.
keyring = { version = "3.6.3", features = ["apple-native", "windows-native"] }

[dev-dependencies]
tempfile = "3"
